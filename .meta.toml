# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[gitignore]
extra_lines = """
# buildout local dev (Makefile)
.plone-version
.plone.versioncheck.tracked.json
.python-version
CACHEDIR.TAG
src/*
!src/collective
htmlcov/
*.log
output.xml
report.html
"""

[tox]
use_mxdev = true
test_environment_variables = """
    # Playwright (rfbrowser init) does not know ubuntu-latest 26.04 yet
    PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64
"""
test_matrix = {"6.2" = ["*"]}
test_deps_additional = """
collective.contact.core @ file://{toxinidir}/sources/collective.contact.core
    collective.js.tooltipster @ file://{toxinidir}/sources/collective.js.tooltipster
    eea.facetednavigation @ file://{toxinidir}/sources/eea.facetednavigation
    plone.formwidget.contenttree @ file://{toxinidir}/sources/plone.formwidget.contenttree
    plone.formwidget.masterselect @ file://{toxinidir}/sources/plone.formwidget.masterselect
"""

[pyproject]
codespell_ignores = "sergent,pathes"
dependencies_ignores = "['collective.js.backbone', 'plone.formwidget.contenttree']"
